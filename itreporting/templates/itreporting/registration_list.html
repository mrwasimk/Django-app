{% extends 'itreporting/base.html' %}
{% block content %}
<h1>Registration List</h1>
<ul>
  {% for registration in registrations %}
    <li>
      <a href="{% url 'itreporting:registration-detail' registration.pk %}">
        Registration: {{ registration.pk }} - Student: {{ registration.student }} - Module: {{ registration.module }}
      </a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
